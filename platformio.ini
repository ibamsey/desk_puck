; desk_puck — ESP32-2424S012 round display starter (same hardware as HomePuck)

[platformio]
default_envs = esp32-2424s012

[env:esp32-2424s012]
platform = espressif32@^6.9.0
board = esp32-c3-devkitm-1
board_build.partitions = huge_app.csv
framework = arduino
monitor_speed = 115200
upload_port = COM7
monitor_port = COM7

build_src_filter =
    +<main.cpp>
    +<LGFX_config.h>
    +<app/>
    +<input/>
    +<display/>
    +<wifi/>
    +<time/>
    +<weather/>
    +<features/clock/>
    +<features/diary/>
    +<features/cube/>
    +<features/tide/>
    +<features/waves/>
    -<features/*/assets/>
    -<features/*/docs/>
    -<features/*/tools/>

extra_scripts = pre:tools/pio_watch_faces.py

build_flags =
    -I include
    -I src
    -I src/features
    -I src/features/clock/include
    -I src/features/diary/include
    -I src/features/cube/include
    -I src/features/tide/include
    -I src/features/waves/include
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPIN_LCD_SCLK=6
    -DPIN_LCD_MOSI=7
    -DPIN_LCD_DC=2
    -DPIN_LCD_CS=10
    -DPIN_LCD_BL=3

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    fbiego/CST816S@^1.1.1
    bblanchon/ArduinoJson@^7.2.0
    https://github.com/ricmoo/QRCode.git
